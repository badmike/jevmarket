<!doctype html>
<html
  lang="en"
  class="h-full"
>
  <head>
    <!-- The daemon rewrites this to its --base-path; every URL in the app is relative to it. -->
    <base href="/" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f0f1f4"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#16171b"
    />
    <link
      rel="icon"
      href="./favicon.svg"
      type="image/svg+xml"
    />
    <!-- Installable app: relative to <base>, so it works under any --base-path. -->
    <link
      rel="manifest"
      href="./manifest.webmanifest"
    />
    <link
      rel="apple-touch-icon"
      href="./apple-touch-icon.png"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="jevmarket"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>jevmarket</title>
    <!-- Applies the stored colour mode before first paint; the key is shared with
         src/composables/useColorMode.ts. -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('jevmarket:color-mode') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-DX7ggs3G.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vue-DNfXAOus.js">

    <link rel="modulepreload" crossorigin href="./assets/Icon-BieC_j2k.js">
    <link rel="modulepreload" crossorigin href="./assets/query-BUECCyy6.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BohFcVBV.css">
  </head>
  <body class="h-full bg-surface text-foreground antialiased">
    <div id="app"></div>
  </body>
</html>
